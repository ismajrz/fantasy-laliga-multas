# Worker de copias semanales (ver README.md, "Copias de seguridad").
# Publicar: cd workers/backup && npx wrangler deploy
name = "fantasy-laliga-backup"
main = "index.js"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

[triggers]
# Miércoles a las 03:30 UTC = 04:30 en Madrid en invierno (05:30 en verano)
crons = ["30 3 * * 3"]

[[kv_namespaces]]
binding = "JORNADAS"
id = "REEMPLAZA_CON_EL_ID_DE_TU_KV"
